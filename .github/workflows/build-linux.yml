name: Build Linux (portable mpv + vf_animejanai)

# Builds a portable Linux mpv bundle (mpv + libmpv.so.2 with the vf_animejanai
# filter, plus its shared-lib deps) on the Ubuntu 22.04 baseline image and
# publishes it as a release asset. The mpv-upscale-2x_animejanai assembler
# downloads this (InstallLinuxMpv) - the Linux analogue of the mpv-winbuild
# release for Windows. The filter lives on master (aji ABI v9).
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (matches MpvForkLinuxVersion in the assembler). Leave blank for <yyyy-mm-dd>-<short commit hash>.'
        required: false
        default: ''
      publish:
        description: 'Publish the release and ask mpv-AnimeJaNai for a bump PR. Off: upload the bundle as a workflow artifact only.'
        type: boolean
        default: true
  push:
    branches: [linux-support]
    paths:
      - ci/build-linux-portable.sh
      - .github/workflows/build-linux.yml

jobs:
  build-linux:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    container:
      image: ghcr.io/the-database/animejanai-linux-build:ubuntu2204
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
    steps:
    - name: Checkout (linux-support = master + the build script; carries vf_animejanai)
      uses: actions/checkout@v4

    # Push-triggered runs and blank dispatch inputs get <UTC date>-<7-char
    # commit hash>, e.g. 2026-10-09-a47670e.
    - name: Release tag
      id: tag
      shell: bash
      env:
        INPUT_TAG: ${{ github.event.inputs.release_tag }}
      run: |
        tag="$INPUT_TAG"
        if [ -z "$tag" ]; then
          tag="$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
        fi
        echo "Release tag: $tag"
        echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Build portable mpv bundle
      run: |
        chmod +x ci/build-linux-portable.sh
        MPV_SRC="$PWD" ci/build-linux-portable.sh "$RELEASE_TAG" "$PWD/out"

    - name: Upload bundle (unpublished test build)
      if: github.event_name == 'workflow_dispatch' && !inputs.publish
      uses: actions/upload-artifact@v4
      with:
        name: mpv-linux-x64-${{ env.RELEASE_TAG }}
        path: out/mpv-linux-x64-${{ env.RELEASE_TAG }}.tar.zst

    - name: Publish release
      if: github.event_name != 'workflow_dispatch' || inputs.publish
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ env.RELEASE_TAG }}
        name: ${{ env.RELEASE_TAG }}
        commit: ${{ github.sha }}
        draft: false
        prerelease: false
        allowUpdates: true
        artifacts: "out/mpv-linux-x64-${{ env.RELEASE_TAG }}.tar.zst"
        token: ${{ secrets.GITHUB_TOKEN }}

  # mpv-AnimeJaNai opens a PR that pins MpvForkLinuxVersion to this release (its bump-pins.yml).
  # Dispatched builds only: push builds come from linux-support, which is behind master.
  notify-downstream:
    needs: build-linux
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    uses: ./.github/workflows/notify-downstream.yml
    with:
      tag: ${{ needs.build-linux.outputs.tag }}
    secrets: inherit
