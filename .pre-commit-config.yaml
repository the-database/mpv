repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-case-conflict
    - id: check-executables-have-shebangs
    - id: check-illegal-windows-names
    - id: check-json
    - id: check-shebang-scripts-are-executable
    - id: check-xml
      exclude: ^TOOLS/mpv-osd-symbols.sfdir/font.props$
    - id: check-yaml
    - id: end-of-file-fixer
      exclude: ^TOOLS/osxbundle/mpv.app/Contents/PkgInfo$
    - id: fix-byte-order-marker
    - id: mixed-line-ending
    - id: trailing-whitespace
- repo: https://github.com/codespell-project/codespell
  rev: v2.4.3
  hooks:
    - id: codespell
      # ASS's bord tag and the isolated TE syllable in the rotated-text fixture
      # are intentional, not spelling errors.
      args: ["--ignore-words-list", "ALS,als,bord,datas,DNE,enew,HDA,numer,ontop,optionA,Paeth,pathc,inout,requestor,TE"]
      exclude: ^(etc/menu.conf|misc/language.c)$
